name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin name
        id: plugin
        run: echo "name=$(jq -r '.name' package.json)" >> "$GITHUB_OUTPUT"

      # On a tag push, the tag is the source of truth for the release version — package.json is
      # rewritten to match it here so the shipped zip is always correct, but this never gets
      # committed back to git; the workspace copy is only used to build the zip below.
      # On a manual (workflow_dispatch) run there's no tag, so package.json's own version is kept.
      - name: Resolve release version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            jq --arg v "$version" '.version = $v' package.json > package.json.tmp
            mv package.json.tmp package.json
          else
            version="$(jq -r '.version' package.json)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Build the zip outside the checkout so it can never include itself, and so it
      # only contains what the panel needs to import the plugin (no VCS/CI/dev-only files).
      - name: Build plugin zip
        run: |
          mkdir -p /tmp/dist
          zip -r "/tmp/dist/${{ steps.plugin.outputs.name }}-${{ steps.version.outputs.version }}.zip" . \
            -x '.git/*' \
            -x '.github/*' \
            -x '.claude/*' \
            -x '.gitignore' \
            -x 'tmp/*'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plugin.outputs.name }}-${{ steps.version.outputs.version }}
          path: /tmp/dist/${{ steps.plugin.outputs.name }}-${{ steps.version.outputs.version }}.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/dist/${{ steps.plugin.outputs.name }}-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
